<div class="worker-shell">

  <!-- ───── Top Tactile Navigation Header ───── -->
  <header class="worker-topbar">
    <div class="topbar-left">
      @if (isSubPage()) {
        <!-- Always visible giant Back Button on child pages -->
        <button (click)="goBack()" class="back-btn" id="btn-header-back">
          <svg class="w-6 h-6 stroke-current" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          <span>← Back to Menu</span>
        </button>
      } @else {
        <!-- Main Brand Logo / Hub Title -->
        <div class="worker-brand">
          <div class="brand-avatar">B</div>
          <div>
            <h1 class="brand-title">Brewhouse</h1>
            <p class="brand-subtitle">Worker Tactile Screen POS</p>
          </div>
        </div>
      }
    </div>

    <!-- Top Right Worker Info & Logout -->
    <div class="topbar-right">
      <div class="worker-badge">
        <div class="worker-avatar-badge">{{ (username || 'W')[0].toUpperCase() }}</div>
        <div class="hidden sm:flex flex-col text-left">
          <span class="worker-name">{{ username || 'Worker' }}</span>
          <span class="worker-role font-sans text-xs opacity-75">Staff</span>
        </div>
      </div>

      <button class="topbar-logout-btn" (click)="logout()" id="btn-logout" title="Log out">
        <svg viewBox="0 0 20 20" fill="none" class="w-5 h-5">
          <path d="M7 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3M13 14l3-4-3-4M16 10H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="hidden md:inline font-medium">Exit</span>
      </button>
    </div>
  </header>

  <!-- ───── Main Content Area ───── -->
  <main class="worker-main">
    <router-outlet />
  </main>

</div>
