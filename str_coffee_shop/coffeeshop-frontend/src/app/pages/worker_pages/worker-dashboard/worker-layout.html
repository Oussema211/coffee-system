<div class="worker-shell">

  <!-- ───── Top Tactile Navigation Header ───── -->
  <header class="worker-topbar">
    <div class="topbar-left">
      @if (isSubPage()) {
        <!-- Always visible Back Button on child pages -->
        <button (click)="goBack()" class="back-btn" id="btn-header-back">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M13 4l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Back to Hub</span>
        </button>
      } @else {
        <!-- Main Brand Logo / Hub Title -->
        <div class="worker-brand">
          <img src="logo_one.jpg" alt="Black Bear Coffee Shop" class="brand-logo-topbar" />
          <div>
            <h1 class="brand-title">Black Bear</h1>
            <p class="brand-subtitle">Coffee Shop · Worker POS</p>
          </div>
        </div>
      }
    </div>

    <!-- Top Right Worker Info & Logout -->
    <div class="topbar-right">
      <div class="worker-badge">
        <div class="worker-avatar-badge">{{ (username || 'W')[0].toUpperCase() }}</div>
        <div style="display:flex;flex-direction:column;text-align:left;">
          <span class="worker-name">{{ username || 'Worker' }}</span>
          <span class="worker-role">Staff</span>
        </div>
      </div>

      <button class="topbar-logout-btn" (click)="logout()" id="btn-logout" title="Log out">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M7 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3M13 14l3-4-3-4M16 10H8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Exit</span>
      </button>
    </div>
  </header>

  <!-- ───── Main Content Area ───── -->
  <main class="worker-main">
    <router-outlet />
  </main>

</div>
