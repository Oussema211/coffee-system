<div class="admin-shell">

  <!-- ───── Sidebar ───── -->
  <aside class="sidebar">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-icon">B</div>
      <span class="brand-name">Brewhouse</span>
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav">

      <!-- Dashboard -->
      <a routerLink="/admin" routerLinkActive="nav-active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="nav-item" id="nav-dashboard">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        Dashboard
      </a>

      <!-- Orders -->
      <a routerLink="/admin/orders" routerLinkActive="nav-active"
         class="nav-item" id="nav-orders">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <path d="M4 4h12a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M7 8h6M7 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Orders
      </a>

      <!-- Menu -->
      <a routerLink="/admin/menu" routerLinkActive="nav-active"
         class="nav-item" id="nav-menu">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 6v4l2.5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Menu
      </a>

      <!-- Categories -->
      <a routerLink="/admin/categories" routerLinkActive="nav-active"
         class="nav-item" id="nav-categories">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <path d="M3 5h4M3 10h4M3 15h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <rect x="9" y="4" width="8" height="3.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="9" y="9" width="8" height="3.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="9" y="14" width="8" height="3.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        Categories
      </a>

      <!-- Workers -->
      <a routerLink="/admin/workers" routerLinkActive="nav-active"
         class="nav-item" id="nav-workers">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M2 17c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="15" cy="7" r="2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M18 17c0-2.21-1.343-3.5-3-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Workers
      </a>

      <!-- Tables -->
      <a routerLink="/admin/tables" routerLinkActive="nav-active"
         class="nav-item" id="nav-tables">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        Tables
      </a>

      <!-- Reports -->
      <a routerLink="/admin/reports" routerLinkActive="nav-active"
         class="nav-item" id="nav-reports">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none">
          <path d="M4 15V10M8 15V7M12 15V9M16 15V5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Reports
      </a>

    </nav>

    <!-- User / logout -->
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar">{{ (username || 'A')[0].toUpperCase() }}</div>
        <div class="user-info">
          <span class="user-name">{{ username || 'Admin' }}</span>
          <span class="user-role">Administrator</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" id="btn-logout" title="Log out">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M7 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3M13 14l3-4-3-4M16 10H8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </aside>

  <!-- ───── Main content ───── -->
  <main class="admin-main">
    <router-outlet />
  </main>

</div>
