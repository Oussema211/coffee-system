# Database Configuration (credentials must be provided via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coffeeshop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:coffee_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — Supabase pooler compatibility
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA Configuration
# Schema is managed by Flyway migrations in src/main/resources/db/migration.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway — baselines the pre-existing Supabase schema (assumed to be V1),
# then applies V2+ additive migrations.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Base schema created by Hibernate (pre-Flyway)

# JWT Configuration (secret MUST be provided via the JWT_SECRET environment variable,
# at least 32 characters long. The application refuses to start without it.)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Setup key required to create the first ADMIN account via POST /api/auth/register/admin.
# When unset, admin self-registration is disabled. Provide via the ADMIN_SETUP_KEY env var.
app.admin-setup-key=${ADMIN_SETUP_KEY:}

# Server Configuration
server.port=8080
server.forward-headers-strategy=framework

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Hide OS/process env keys from /actuator/info
management.info.env.enabled=false

# Receipt Configuration
coffee.shop.name=Coffee Shop
# Fiscal information printed on receipts (Tunisian invoice compliance)
coffee.shop.matricule=${SHOP_MATRICULE:}
coffee.shop.address=${SHOP_ADDRESS:}
coffee.shop.phone=${SHOP_PHONE:}

# Allow circular references (temporary fix)
#spring.main.allow-circular-references=true
